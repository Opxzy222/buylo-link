<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open in Buylo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin-bottom: 20px;
      object-fit: contain;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 12px;
    }
    #status {
      font-size: 1.1rem;
      opacity: 0.85;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      padding: 15px 32px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1.05rem;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }
    .btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }
    .hint {
      margin-top: 28px;
      font-size: 0.9rem;
      opacity: 0.6;
      max-width: 320px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <img src="/logo.png" alt="Buylo Logo" class="logo" onerror="this.style.display='none'" />
  
  <h1>Buylo</h1>
  <p id="status">Opening the space in the Buylo app…</p>
  
  <a class="btn" id="openBtn" href="#">Open in Buylo</a>
  
  <p class="hint">
    Don’t have the app yet?<br>
    Install Buylo, then tap the button again.
  </p>

  <script>
    (function () {
      var path = window.location.pathname || '';
      var match = path.match(/\/link\/shop\/([^\/\?\#]+)/i);
      var shopId = match ? decodeURIComponent(match[1]) : null;

      if (!shopId) {
        // fallback for old links
        var params = new URLSearchParams(window.location.search);
        shopId = params.get('shop');
        if (!shopId) {
          var oldMatch = path.match(/\/shop\/([^\/\?\#]+)/i);
          if (oldMatch) shopId = decodeURIComponent(oldMatch[1]);
        }
      }

      if (!shopId) {
        document.getElementById('status').textContent = 'Invalid space link.';
        document.getElementById('openBtn').style.display = 'none';
        return;
      }

      var appUrl = 'buylo://shop/' + encodeURIComponent(shopId);
      document.getElementById('openBtn').href = appUrl;
      window.location.href = appUrl;
    })();
  </script>
</body>
</html>
