<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buylo – Discover Local Spaces</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo {
      width: 90px;
      height: 90px;
      border-radius: 22px;
      margin-bottom: 24px;
      object-fit: contain;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 1.15rem;
      opacity: 0.85;
      max-width: 420px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      padding: 16px 36px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1.05rem;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }
    .btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }
    .footer {
      margin-top: 60px;
      font-size: 0.85rem;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <!-- Replace logo.png with your actual logo file. -->
  <img src="/logo.png" alt="Buylo Logo" class="logo" onerror="this.style.display='none'" />
  
  <h1>Buylo</h1>
  <p>Discover and join local spaces around you. Connect with people, shops, and communities nearby.</p>
  
  <a href="#" class="btn">Download the App</a>

  <div class="footer">© 2026 Buylo</div>
</body>
</html>
